<body>

  <header class="home-header">
    <div class="container">
      <a href="index.html" class="home-brand" aria-label="Accueil - MON SUCCÈS">
        <div class="home-brand-icon" aria-hidden="true">
          <img src="assets/logo.svg" alt="Logo MON SUCCÈS" style="width:100%;height:100%;object-fit:contain;">
        </div>
        <div class="home-brand-text"><strong>MON SUCCÈS</strong><span>Épargner • Partager • Réussir</span></div>

      <nav class="home-nav" role="navigation" aria-label="Navigation principale">

      </nav>
    </div>
  </header>

  <main>
    <section class="container" style="padding:48px 0;">
      <div class="card">
        <h2>Demande de prêt</h2>
        <p>Faites votre demande de prêt simplement et rapidement.</p>

        <form id="pretForm" aria-label="Formulaire de demande de prêt">
          <div class="form-group">
            <label for="montant">Montant souhaité (FCFA)</label>
            <input type="number" id="montant" name="montant" placeholder="Exemple : 100000" min="1000" required>
          </div>

          <div class="form-group">
            <label for="duree">Durée de remboursement</label>
            <select id="duree" name="duree" required>
              <option value="">Choisir une durée</option>
              <option value="1">1 mois</option>
              <option value="2">2 mois</option>
              <option value="3">3 mois</option>
              <option value="6">6 mois</option>
              <option value="12">12 mois</option>
            </select>
          </div>

          <div class="form-group">
            <label for="motif">Motif du prêt</label>
            <textarea id="motif" name="motif" placeholder="Expliquez brièvement l'utilisation du prêt" rows="4" required></textarea>
          </div>

          <button class="btn" type="submit">Envoyer ma demande</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

    <div class="container">
      <div>
