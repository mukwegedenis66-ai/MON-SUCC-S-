<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MON SUCCÈS — Créer un compte</title>
  <meta name="description" content="Rejoignez MON SUCCÈS pour gérer votre épargne et vos projets. Créez un compte en quelques étapes.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mukwegedenis66-ai.github.io/MON-SUCC-S-/inscription.html">

  <!-- Open Graph / Social -->
  <meta property="og:title" content="MON SUCCÈS — Créer un compte">
  <meta property="og:description" content="Rejoignez MON SUCCÈS pour gérer votre épargne et vos projets.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mukwegedenis66-ai.github.io/MON-SUCC-S-/inscription.html">
  <meta property="og:image" content="/MON-SUCC-S-/assets/logo.svg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#0b6b4f">

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="/MON-SUCC-S-/assets/logo.svg" type="image/svg+xml">

  <style>
    /* Page-specific styles kept as before but compacted */
    .auth-page { min-height:100vh; background:linear-gradient(135deg,#f3fff8,#ffffff,#eafff1); }
    .auth-header{background:#fff;border-bottom:1px solid #e5eee9;padding:14px 20px}
    .auth-brand{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between}
    .brand-left{display:flex;align-items:center;gap:12px}
    .brand-logo{width:48px;height:48px;border-radius:16px;background:#e9f8ef;display:flex;align-items:center;justify-content:center;font-size:27px}
    .brand-name{font-size:22px;font-weight:800;color:#075c43;line-height:1.1}
    .brand-tagline{font-size:13px;color:#69756f;margin-top:3px}
    .menu-btn{width:45px;height:45px;border:0;border-radius:14px;background:#075c43;color:#fff;font-size:23px}
    .auth-container{max-width:600px;margin:35px auto;padding:0 18px 40px}
    .auth-card{background:rgba(255,255,255,.96);border:1px solid #e1ebe5;border-radius:25px;padding:32px 24px;box-shadow:0 15px 45px rgba(0,70,45,.09)}
    .auth-icon{width:70px;height:70px;margin:0 auto 15px;border-radius:50%;background:#e7f7ed;display:flex;align-items:center;justify-content:center;font-size:32px}
    .auth-title{text-align:center;color:#073e30;font-size:31px;margin:0}
    .auth-subtitle{text-align:center;color:#66736d;font-size:16px;line-height:1.5;margin:10px auto 26px}
    .auth-form{display:flex;flex-direction:column;gap:14px}
    .auth-input{width:100%;box-sizing:border-box;padding:17px 18px;border:1.5px solid #d9e2de;border-radius:16px;font-size:17px;background:#fff}
    .auth-input:focus{border-color:#087653;box-shadow:0 0 0 3px rgba(8,118,83,.10)}
    .auth-button{width:100%;border:0;border-radius:16px;padding:17px;margin-top:4px;background:#087653;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
    .auth-link{text-align:center;margin-top:22px;font-size:16px;color:#596760}
    .auth-link a{color:#087653;font-weight:700;text-decoration:none}
    #message{text-align:center;margin-top:18px;font-size:15px}
    #message.success{color:#087653}#message.error{color:#c62828}
    @media (max-width:480px){.auth-header{padding:12px 15px}.auth-container{margin:22px auto;padding:0 12px 30px}.auth-card{padding:27px 18px;border-radius:22px}.auth-title{font-size:28px}.auth-input{font-size:16px;padding:16px}}
  </style>
</head>

<body class="auth-page">

<header class="auth-header">
  <div class="auth-brand">
    <div class="brand-left">
      <div class="brand-logo" aria-hidden="true"><img src="assets/logo.svg" alt="Logo MON SUCCÈS" style="width:100%;height:100%;object-fit:contain"></div>
      <div>
        <div class="brand-name">MON SUCCÈS</div>
        <div class="brand-tagline">Épargner • Partager • Réussir</div>
      </div>
    </div>
    <a class="menu-btn" href="index.html" aria-label="Accueil">🏠</a>
  </div>
</header>

<main class="auth-container">
  <section class="auth-card" aria-labelledby="signupTitle">
    <div class="auth-icon" aria-hidden="true">👤</div>
    <h1 id="signupTitle" class="auth-title">Créer un compte</h1>
    <p class="auth-subtitle">Rejoignez MON SUCCÈS en quelques étapes pour commencer à épargner et préparer vos projets.</p>

    <form id="signupForm" class="auth-form" aria-label="Formulaire d'inscription">
      <label for="name" class="sr-only">Nom complet</label>
      <input class="auth-input" type="text" id="name" name="name" placeholder="Nom complet" required>

      <label for="phone" class="sr-only">Téléphone</label>
      <input class="auth-input" type="tel" id="phone" name="phone" placeholder="Téléphone" required>

      <label for="email" class="sr-only">Email</label>
      <input class="auth-input" type="email" id="email" name="email" placeholder="Email" required>

      <label for="password" class="sr-only">Mot de passe</label>
      <input class="auth-input" type="password" id="password" name="password" placeholder="Mot de passe (6 caractères min.)" minlength="6" required>

      <button class="auth-button" type="submit">Créer mon compte →</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <div class="auth-link">Déjà inscrit ? <a href="connexion.html">Se connecter</a></div>
  </section>
</main>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/menu.js"></script>
</body>

</html>
