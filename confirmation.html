    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f2fff7,#ffffff,#e8fff0);font-family:Arial,sans-serif;color:#073e30}
    .confirm-header{background:#fff;border-bottom:1px solid #e3ebe7;padding:14px 18px}
    .brand{max-width:650px;margin:auto;display:flex;align-items:center;gap:14px}
    .logo{width:58px;height:58px;border-radius:18px;background:#e8f8ee;display:flex;align-items:center;justify-content:center;font-size:34px}

    .tagline{color:#68746f;margin-top:4px;font-size:14px}

    .intro{color:#66736d;font-size:17px;line-height:1.6;margin:16px auto 28px}
    .email-box{background:#f3faf6;border-radius:16px;padding:16px;color:#075c43;font-weight:600;margin-bottom:24px}
    .buttons{display:flex;flex-direction:column;gap:13px}
    .btn{display:block;width:100%;box-sizing:border-box;padding:17px;border-radius:16px;text-decoration:none;font-size:17px;font-weight:700}
    .btn-primary{background:#087653;color:#fff}.btn-secondary{border:1.5px solid #087653;color:#087653;background:#fff}
