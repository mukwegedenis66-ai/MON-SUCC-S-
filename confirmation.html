<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription réussie — MON SUCCÈS</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f2fff7, #ffffff, #e8fff0);
      font-family: Arial, sans-serif;
      color: #073e30;
    }

    .confirm-header {
      background: #fff;
      border-bottom: 1px solid #e3ebe7;
      padding: 14px 18px;
    }

    .brand {
      max-width: 650px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #e8f8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      color: #075c43;
    }

    .tagline {
      color: #68746f;
      margin-top: 4px;
      font-size: 14px;
    }

    .confirm-container {
      max-width: 580px;
      margin: 45px auto;
      padding: 0 16px;
    }

    .confirm-card {
      background: #fff;
      border: 1px solid #dfe9e4;
      border-radius: 28px;
      padding: 38px 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,70,45,.10);
    }

    .success-icon {
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e2f7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 43px;
    }

    h1 {
      margin: 0;
      font-size: 31px;
    }

    .intro {
      color: #66736d;
      font-size: 17px;
      line-height: 1.6;
      margin: 16px auto 28px;
    }

    .email-box {
      background: #f3faf6;
      border-radius: 16px;
      padding: 16px;
      color: #075c43;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 17px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .btn-primary {
      background: #087653;
      color: white;
    }

    .btn-secondary {
      border: 1.5px solid #087653;
      color: #087653;
      background: white;
    }

    @media (max-width: 480px) {
      .confirm-container {
        margin: 25px auto;
        padding: 0 12px;
      }

      .confirm-card {
        padding: 32px 18px;
        border-radius: 24px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header class="confirm-header">
  <div class="brand">
    <div class="logo">🌿</div>
    <div>
      <div class="brand-name">MON SUCCÈS</div>
      <div class="tagline">Épargner • Partager • Réussir</div>
    </div>
  </div>
</header>

<main class="confirm-container">
  <section class="confirm-card">

    <div class="success-icon">✓</div>

    <h1>Inscription réussie !</h1>

    <p class="intro">
      Votre compte MON SUCCÈS a bien été créé.
      Pour terminer votre inscription, consultez votre
      boîte e-mail et cliquez sur le lien de confirmation.
    </p>

    <div class="email-box">
      📧 Vérifiez votre boîte de réception
    </div>

    <div class="buttons">
      <a href="connexion.html" class="btn btn-primary">
        Se connecter →
      </a>

      <a href="index.html" class="btn btn-secondary">
        Retour à l'accueil
      </a>
    </div>

  </section>
</main>

</body>
  </html>
