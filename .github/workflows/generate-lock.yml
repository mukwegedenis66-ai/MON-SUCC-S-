name: Generate lockfile on: workflow_dispatch: push: branches: - feature/ux-polish

permissions: contents: write

jobs: generate-lock: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 with: fetch-depth: 0 - name: Use Node.js 18 uses: actions/setup-node@v4 with: node-version: '18' - name: Generate package-lock.json run: npm install --package-lock-only - name: Commit and push lockfile if changed run: | git config user.name "github-actions[bot]" git config user.email "github-actions[bot]@users.noreply.github.com" git add package-lock.json if git diff --staged --quiet; then echo "No changes to commit" else git commit -m "chore: add package-lock.json (generated by workflow)" git push origin HEAD:feature/ux-polish fi
