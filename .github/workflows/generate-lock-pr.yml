name: Generate lockfile and open PR on: workflow_dispatch:

permissions: contents: write

jobs: generate_and_pr: runs-on: ubuntu-latest steps: - name: Checkout repository uses: actions/checkout@v4 with: fetch-depth: 0 - name: Setup Node.js 18 uses: actions/setup-node@v4 with: node-version: '18' - name: Generate package-lock.json run: npm install --package-lock-only - name: Commit lockfile to new branch and push run: | if [ ! -f package-lock.json ]; then echo "package-lock.json was not generated — exiting" exit 1 fi BRANCH="generate-lock-${GITHUB_RUN_ID}" git config user.name "github-actions[bot]" git config user.email "github-actions[bot]@users.noreply.github.com" git checkout -b "$BRANCH" git add package-lock.json git commit -m "chore: add package-lock.json (generated by workflow)" git push --set-upstream origin "$BRANCH" - name: Create Pull Request uses: peter-evans/create-pull-request@v5 with: token: ${{ secrets.GITHUB_TOKEN }} branch: generate-lock-${{ github.run_id }} base: feature/ux-polish title: chore: add package-lock.json (generated by workflow) body: This PR adds package-lock.json generated by workflow so CI can run.
