name: Generate lockfile and open PR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_and_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add package-lock.json (generated by workflow)"
          branch: generate-lock-${{ github.run_id }}
          base: feature/ux-polish
          title: "chore: add package-lock.json (generated by workflow)"
          body: "This PR adds package-lock.json generated by workflow so CI can run."
